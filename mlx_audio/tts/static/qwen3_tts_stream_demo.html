<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3-TTS Incremental Stream Demo</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e6edf7; }
    main { width: min(720px, calc(100% - 32px)); margin: 8vh auto; }
    h1 { margin-bottom: 8px; } p { color: #aab8d0; line-height: 1.5; }
    .card { background: #151d33; border: 1px solid #2b385a; border-radius: 14px; padding: 20px; margin-top: 20px; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; color: #b9c7e3; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #44557c; border-radius: 8px; background: #0d1426; color: inherit; padding: 10px; font: inherit; }
    textarea { min-height: 104px; resize: vertical; } button { margin-top: 18px; border: 0; border-radius: 8px; padding: 11px 16px; background: #78a9ff; color: #071326; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .55; cursor: progress; } #status { white-space: pre-wrap; font-family: ui-monospace, monospace; color: #8ee6a7; }
  </style>
</head>
<body>
  <main>
    <h1>Qwen3-TTS incremental stream</h1>
    <p>This page sends several text deltas to one TTS session, then plays the returned f32le PCM chunks as soon as they arrive. A click is required by browser autoplay policy.</p>
    <section class="card">
      <label for="model">Model path or Hugging Face model ID</label>
      <input id="model" value="Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice">
      <label for="voice">Voice</label>
      <input id="voice" value="Ryan">
      <label for="text">Preset deltas — one line per simulated LLM delta</label>
      <textarea id="text">Hello, and welcome to the streaming text to speech demo.
The first sentence is committed before the next delta arrives, so you can hear that the same session continues smoothly.
When this final sentence arrives, the stream is finalized and the decoder finishes naturally.</textarea>
      <button id="play">Start listening</button>
      <p id="status">Ready.</p>
    </section>
  </main>
  <script>
    const play = document.querySelector('#play');
    const status = document.querySelector('#status');
    let context;

    function update(message) { status.textContent = message; }
    async function listen() {
      play.disabled = true;
      context?.close();
      context = new AudioContext({ sampleRate: 24000 });
      await context.resume();
      const payload = {
        model: document.querySelector('#model').value.trim(),
        voice: document.querySelector('#voice').value.trim(),
        language: 'English',
        chunks: document.querySelector('#text').value.split('\n').filter(Boolean).map(line => line + ' '),
        commit_policy: 'safe_sentence', streaming_interval: 0.24, temperature: 0,
      };
      let scheduledAt = context.currentTime + 0.06, chunks = 0, samples = 0, tail = new Uint8Array();
      try {
        update('Connecting to incremental session…');
        const response = await fetch('/v1/audio/speech/incremental-demo', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
        });
        if (!response.ok || !response.body) throw new Error(await response.text() || response.statusText);
        const reader = response.body.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const merged = new Uint8Array(tail.length + value.length); merged.set(tail); merged.set(value, tail.length);
          const complete = merged.byteLength - (merged.byteLength % 4); tail = merged.slice(complete);
          if (!complete) continue;
          const pcm = new Float32Array(merged.buffer, merged.byteOffset, complete / 4);
          const audio = context.createBuffer(1, pcm.length, 24000); audio.copyToChannel(pcm, 0);
          const source = context.createBufferSource(); source.buffer = audio; source.connect(context.destination);
          scheduledAt = Math.max(scheduledAt, context.currentTime + 0.04); source.start(scheduledAt); scheduledAt += audio.duration;
          chunks++; samples += pcm.length; update(`Playing stream\nAudio chunks: ${chunks}\nSamples: ${samples}\nQueued through: ${(scheduledAt - context.currentTime).toFixed(2)} s`);
        }
        update(`Complete — ${chunks} audio chunks, ${(samples / 24000).toFixed(2)} seconds.`);
      } catch (error) { update(`Error: ${error.message}`); }
      finally { play.disabled = false; }
    }
    play.addEventListener('click', listen);
  </script>
</body>
</html>
